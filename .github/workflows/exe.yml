name: Windows exe derle

on:
  push:
    branches: [main]
    paths: ["kaynak/masaustu/**", "kaynak/web/**", ".github/workflows/exe.yml", "!kaynak/masaustu/dps/data/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Paketler
        run: python -m pip install pywebview pyinstaller pytest
      - name: Sürüm numarası (1.4.<çalıştırma>)
        shell: bash
        run: sed -i "s/^APP_VERSION = \"[0-9.]*\"/APP_VERSION = \"1.4.${{ github.run_number }}\"/" kaynak/masaustu/main.py && grep APP_VERSION kaynak/masaustu/main.py | head -1
      - name: Testler
        working-directory: kaynak/masaustu
        run: python -m pytest -q tests
      - name: Arayüzü derle
        run: python kaynak/build_all.py
      - name: Sayfa betiği hatasız mı
        shell: bash
        run: node -e "const h=require('fs').readFileSync('kaynak/masaustu/app/index.html','utf8');for(const m of h.matchAll(/<script>([\s\S]*?)<\/script>/g))new Function(m[1]);console.log('ok')"
      - name: Sürüm
        id: v
        shell: bash
        run: echo "ver=$(grep -oP 'APP_VERSION = \"\K[^\"]+' kaynak/masaustu/main.py)" >> $GITHUB_OUTPUT
      - name: Exe
        working-directory: kaynak/masaustu
        run: python -m PyInstaller --noconfirm --onefile --windowed --name KanatixDaevaAsistani --icon icon.ico --add-data "app;app" --add-data "dps\data;dps\data" --add-data "harita;harita" --hidden-import tkinter main.py
      - name: Yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-v${{ steps.v.outputs.ver }}
          name: Kanatix Daeva Asistanı (bilgisayar) ${{ steps.v.outputs.ver }}
          body: "Uygulama kuruluysa açılışta bu sürümü kendisi önerir ve günceller. İlk kurulum: KanatixDaevaAsistani.exe dosyasını indir. DPS ölçer için Npcap gerekir: https://npcap.com"
          files: kaynak/masaustu/dist/KanatixDaevaAsistani.exe
          make_latest: false
