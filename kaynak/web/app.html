<body>
<header>
  <h1>⚔ Templar Tank Asistanı</h1>
  <div class="modes" id="modes"></div>
  <div class="spacer"></div>
  <button class="btn" id="exp">Yedek al</button>
  <button class="btn" id="imp">Yedek yükle</button>
  <input type="file" id="impf" accept=".json" hidden>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>

<script>/*DATA*/</script>
<script>const ICONS = /*ICONS*/;</script>
<script>
const TABS = [["akt","Aktif Yetenekler"],["pas","Pasifler"],["stg","Stigmalar"],["mak","Makro"],["pln","Puan Planı"],["dae","Daevanion"]];
let S = load(); let TAB = "akt";
function load(){ try{ const s = JSON.parse(localStorage.getItem("templarTank")); if(s&&s.lv) return merge(s);}catch(e){} return JSON.parse(JSON.stringify(DEFAULT_STATE)); }
function merge(s){ const d = JSON.parse(JSON.stringify(DEFAULT_STATE)); Object.assign(d.lv, s.lv||{}); Object.assign(d.st, s.st||{}); d.mode = s.mode||d.mode; d.freeSkill=s.freeSkill||0; d.freeStigma=s.freeStigma||0; return d; }
function save(){ try{ localStorage.setItem("templarTank", JSON.stringify(S)); }catch(e){} }
const ALL = Object.fromEntries([...ACTIVES,...PASSIVES,...STIGMAS].map(x=>[x.id,x]));
const icon = id => `<img src="${ICONS[id]||""}" alt="">`;
const tot = id => S.lv[id][0] + S.lv[id][1];
const esc = s => String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function reqOf(sk,k){ return k==="s16" ? 16 : (sk.req && sk.req[k]) || 8; }
function slots(t){ return (t>=8)+(t>=12)+(t>=16); }
function picks(sk){
  const t = tot(sk.id), pri = sk.pri[S.mode];
  const avail = pri.filter(k=>t>=reqOf(sk,k));
  const n = slots(t); return { n, chosen: avail.slice(0,n), rest: pri.filter(k=>!avail.slice(0,n).includes(k)) };
}
function chip(sk,k,cls){
  const lock = tot(sk.id) < reqOf(sk,k);
  const nt = sk.not && sk.not[k] ? ` <span class="mut">— ${esc(sk.not[k])}</span>` : "";
  const lk = lock ? ` <span class="mut">🔒 ${reqOf(sk,k)}. sv</span>` : "";
  return `<span class="chip c-${k} ${cls} ${lock?"lock":""}"><b>${RENK[k]}</b>${esc(sk.opts[k])}${lk}${nt}</span>`;
}
function lvInputs(id){
  const [b,x] = S.lv[id];
  return `<div class="lv"><label>Temel</label><input type="number" min="1" max="10" value="${b}" data-id="${id}" data-i="0">
  <label>Bonus (+)</label><input type="number" min="0" max="15" value="${x}" data-id="${id}" data-i="1">
  <span class="tot">Toplam ${b+x}</span></div>`;
}

function rAkt(){
  let h = `<div class="note">Seviyeleri oyundaki gibi gir: <b>Temel</b> = baştaki sayı, <b>Bonus</b> = parantezdeki (+) (Daevanion, ekipman, Arcana). Specialty yuvaları toplam seviyeye göre açılır: 8 → 1 yuva, 12 → 2 yuva, 16 → 3 yuva. Seçilen mod: <b>${MODES[S.mode].ad}</b>.</div><div class="grid2">`;
  for(const sk of ACTIVES){
    const p = picks(sk), t = tot(sk.id);
    const next = [12,16].find(v=>v>t);
    h += `<div class="card"><div class="row">${icon(sk.id)}<div>
      <div class="nm">${sk.ad} <span class="mut small">· ${esc(sk.cd)}</span></div>
      <div class="mut small">${esc(sk.acik)}</div>${lvInputs(sk.id)}
      <div class="small">Açık yuva: <b>${p.n}/3</b>${next?` <span class="mut">· sonraki yuva ${next}. sv (+${next-t} lazım)</span>`:""}</div>
      <div class="small" style="margin-top:6px">✅ Tak:</div><div class="chips">${p.chosen.map(k=>chip(sk,k,"pick")).join("")||'<span class="mut small">Yuva yok</span>'}</div>
      <div class="small" style="margin-top:6px">Diğer olasılıklar (sırayla):</div><div class="chips">${p.rest.map(k=>chip(sk,k,"")).join("")}</div>
    </div></div></div>`;
  }
  return h + "</div>";
}

function rPas(){
  const pri = SKILL_PRI[S.mode].filter(id=>PASSIVES.some(p=>p.id===id));
  let h = `<div class="note">Pasiflerde specialty seçimi yok. Sıra numarası, <b>${MODES[S.mode].ad}</b> için puan verme önceliği (1 = önce).</div><div class="grid2">`;
  for(const p of [...PASSIVES].sort((a,b)=>pri.indexOf(a.id)-pri.indexOf(b.id))){
    h += `<div class="card"><div class="row">${icon(p.id)}<div>
      <div class="nm"><span style="color:var(--acc)">#${pri.indexOf(p.id)+1}</span> ${p.ad}</div>
      <div class="mut small">${esc(p.etki)}</div>${lvInputs(p.id)}</div></div></div>`;
  }
  return h + "</div>";
}

function rStg(){
  const st = STIGMA_SET[S.mode];
  let h = `<div class="sec">${MODES[S.mode].ad} için 4 stigma</div><div class="set">`;
  for(const id of st.set) h += `<div class="setitem">${icon(id)}<div><div class="nm small">${ALL[id].ad}</div><div class="mut small">Sv. ${S.st[id]}</div></div></div>`;
  h += `</div><div class="sec">Duruma göre değişim</div>`;
  for(const [id,why] of st.alt) h += `<div class="setitem" style="margin-bottom:6px">${icon(id)}<div><div class="nm small">${ALL[id].ad}</div><div class="mut small">${esc(why)}</div></div></div>`;
  h += `<div class="note">Kilitler <b>5 / 10 / 15 / 20</b>. seviyede kendiliğinden açılır. Seçili 4 stigmayı skill barına sürüklemeyi unutma.</div><div class="sec">Tüm stigmalar</div><div class="grid2">`;
  for(const s of STIGMAS){
    const l = S.st[s.id], inSet = st.set.includes(s.id);
    h += `<div class="card" style="${inSet?"border-color:var(--acc)":""}"><div class="row">${icon(s.id)}<div>
      <div class="nm">${s.ad} ${inSet?'<span class="chip c-y"><b>Takılı olmalı</b></span>':""} <span class="mut small">· ${s.cd}</span></div>
      <div class="mut small">${esc(s.acik)}</div>
      <div class="lv"><label>Seviye</label><input type="number" min="1" max="20" value="${l}" data-st="${s.id}"></div>
      <div class="lvlrow">${[5,10,15,20].map(v=>`<span class="lvl ${l>=v?"on":"off"}"><b>${v}</b> ${esc(s.sv[v])}</span>`).join("")}</div>
    </div></div></div>`;
  }
  return h + "</div>";
}

function rMak(){
  const set = STIGMA_SET[S.mode].set;
  const list = MACRO[S.mode].filter(id=>!id.startsWith("st_")||set.includes(id));
  let h = `<div class="note">Makro tuşu basılı tutulunca yetenekleri dener; cooldown'daki ya da şartı tutmayanı atlar. <b>Üstteki öncelikli</b> varsayıldı — test: kuklada 5–6 sn basılı tut; sadece en alttaki (filler) basılıyorsa yön terstir, listeyi ters çevir. Delay: <b>10 ms</b> (yetenek kaçırıyorsa 40–50 ms). Normal saldırıyı makroya ekleme.</div>
  <div class="grid2"><div class="card"><div class="sec" style="margin-top:0">Makro sırası — ${MODES[S.mode].ad}</div><ol class="mac">`;
  list.forEach((id,i)=>{ h += `<li>${icon(id)}<span>${ALL[id].ad}${i===list.length-1?' <span class="mut small">(filler, cooldown yok — en sonda)</span>':""}</span></li>`; });
  h += `</ol></div><div class="card"><div class="sec" style="margin-top:0">Makroya koyma (ayrı tuş)</div><ul class="mac">`;
  for(const [id,why] of MACRO_DISI){ if(id.startsWith("st_") && !set.includes(id)) continue;
    h += `<li>${icon(id)}<span>${ALL[id].ad}<br><span class="mut small">${esc(why)}</span></span></li>`; }
  return h + `</ul></div></div>`;
}

function planSkills(budget){
  const pri = SKILL_PRI[S.mode], n = pri.length, lv = Object.fromEntries(pri.map(id=>[id,S.lv[id][0]])), steps = [];
  for(;;){
    let best=null;
    pri.forEach((id,r)=>{ if(lv[id]>=10) return; const c = skillCost(lv[id]+1); if(c>budget) return;
      const sc = c/(n-r); if(!best||sc<best.sc) best={id,c,sc}; });
    if(!best) break; budget -= best.c; lv[best.id]++; steps.push(best);
  }
  return { lv, left: budget, steps };
}
function planStigma(budget){
  const st = STIGMA_SET[S.mode], order = [...st.set, ...st.alt.map(a=>a[0])], n = order.length, lv = Object.fromEntries(order.map(id=>[id,S.st[id]])), steps=[];
  for(;;){ let best=null;
    order.forEach((id,r)=>{ if(lv[id]>=10) return; const c = stigmaCost(lv[id]+1); if(!c||c>budget) return;
      const sc = c/(n-r)/(r<4?2:1); if(!best||sc<best.sc) best={id,c,sc}; });
    if(!best) break; budget-=best.c; lv[best.id]++; steps.push(best); }
  return { lv, left: budget, steps };
}
function refund(id, to){ let s=0; for(let l=S.lv[id][0]; l>to; l--) s+=skillCost(l); return s; }
function sRefund(id, to){ let s=0; for(let l=S.st[id]; l>to; l--) s+=stigmaCost(l)||0; return s; }

function rPln(){
  const ps = planSkills(S.freeSkill), pt = planStigma(S.freeStigma);
  const diff = (o,cur) => Object.entries(o).filter(([id,v])=>v!==cur(id)).map(([id,v])=>`<tr><td>${icon(id)}</td><td>${ALL[id].ad}</td><td>${cur(id)} → <b class="ok">${v}</b></td></tr>`).join("");
  let h = `<div class="note">Maliyet — Yetenek: 2–4. sv 1 puan, 5–7. sv 2 puan, 8–10. sv 4 puan (1→10 = 21). Stigma: 2–5. sv 1 puan, 6–10. sv 2 puan (1→10 = 14). Plan "önce ucuz seviyeler, öncelik sırasına göre" mantığıyla yapılır.</div>
  <div class="grid2"><div class="card"><div class="sec" style="margin-top:0">Skill puanı</div>
  <div class="lv"><label>Boşta puan</label><input type="number" min="0" value="${S.freeSkill}" id="fs"></div>
  <table class="plan">${diff(ps.lv,id=>S.lv[id][0])||'<tr><td class="mut">Puan girince plan burada çıkar.</td></tr>'}</table>
  <div class="small mut">Artan puan: ${ps.left}</div></div>
  <div class="card"><div class="sec" style="margin-top:0">Stigma puanı</div>
  <div class="lv"><label>Boşta puan</label><input type="number" min="0" value="${S.freeStigma}" id="ft"></div>
  <table class="plan">${diff(pt.lv,id=>S.st[id])||'<tr><td class="mut">Puan girince plan burada çıkar.</td></tr>'}</table>
  <div class="small mut">Artan puan: ${pt.left} · 10. seviye üstü maliyeti henüz bilinmiyor.</div></div></div>
  <div class="sec">Puan gerekirse buradan geri al (${MODES[S.mode].ad})</div><div class="card"><table><tr><th></th><th>Yetenek</th><th>Neden</th><th>Temel</th><th>1'e indirince</th></tr>`;
  for(const [id,why] of SKILL_KAYNAK[S.mode].filter(([id])=>S.lv[id][0]>1)) h += `<tr><td>${icon(id)}</td><td>${ALL[id].ad}</td><td class="mut">${esc(why)}</td><td>${S.lv[id][0]}</td><td><b class="ok">+${refund(id,1)}</b> puan</td></tr>`;
  const unused = STIGMAS.filter(s=>!STIGMA_SET[S.mode].set.includes(s.id) && S.st[s.id]>1);
  for(const s of unused) h += `<tr><td>${icon(s.id)}</td><td>${s.ad} <span class="mut small">(stigma)</span></td><td class="mut">Bu modda takılı değil</td><td>${S.st[s.id]}</td><td><b class="ok">+${sRefund(s.id,1)}</b> stigma puanı</td></tr>`;
  h += `</table></div><div class="sec">Geri alma hesaplayıcı</div><div class="card"><div class="lv">
  <select id="rfid">${[...ACTIVES,...PASSIVES].map(x=>`<option value="${x.id}">${x.ad}</option>`).join("")}</select>
  <label>Hedef temel seviye</label><input type="number" min="1" max="10" value="1" id="rfto"><span class="tot" id="rfout"></span></div></div>`;
  return h;
}

function rDae(){
  const rows = [...ACTIVES,...PASSIVES].map(x=>{ const b=S.lv[x.id][1];
    const d = b<4 ? `<span class="bad">Daevanion'da ${4-b} düğüm eksik olabilir</span>` : b>4 ? `<span class="ok">Tam (+${b-4} ekipman/Arcana)</span>` : `<span class="ok">Tam</span>`;
    return `<tr><td>${icon(x.id)}</td><td>${x.ad}</td><td>+${b}</td><td>${d}</td></tr>`; }).join("");
  return `<div class="note">Her yetenek 4 normal tahtanın (Nezekan, Zikel, Vaizel, Triniel) her birinde 1 düğüm → Daevanion'dan en fazla <b>+4</b>. 16. seviye için gereken ek +2 sadece <b>ekipman veya Arcana</b>dan gelir.</div>
  <div class="grid2"><div class="card"><div class="sec" style="margin-top:0">Tahtalar</div><table>
  <tr><th>Tahta</th><th>Açılış</th><th>Öne çıkan</th></tr>
  <tr><td>Nezekan</td><td>12. sv</td><td>Combat Speed, cooldown azaltma</td></tr>
  <tr><td>Zikel</td><td>20. sv</td><td>Damage Boost, Damage Tolerance</td></tr>
  <tr><td>Vaizel</td><td>30. sv</td><td>Kritik hasar / kritik direnç</td></tr>
  <tr><td>Triniel</td><td>40. sv</td><td>Multi-Hit şansı / direnci</td></tr>
  <tr><td>Ariel</td><td>—</td><td>Sadece PvE (boss hasarı vb.) — Ariel parçaları (Ascension Trial)</td></tr>
  <tr><td>Azphel</td><td>45. sv</td><td>Sadece PvP — Azphel parçaları (savaş alanı)</td></tr></table></div>
  <div class="card"><div class="sec" style="margin-top:0">Düğüm türleri</div><table>
  <tr><th>Tür</th><th>Puan</th><th>Ne verir</th></tr>
  <tr><td>Gri / altın kare</td><td>1</td><td>Stat (HP, MP, Attack, Defense)</td></tr>
  <tr><td class="ok">Yeşil</td><td>2</td><td>Pasif yetenek +1 sv</td></tr>
  <tr><td style="color:var(--b)">Mavi (yuvarlak)</td><td>3</td><td>Aktif yetenek +1 sv</td></tr>
  <tr><td style="color:var(--o)">Turuncu (köşeler)</td><td>4</td><td>Büyük yüzde bonusları</td></tr></table>
  <div class="small mut" style="margin-top:6px">Merkezden başlanır, sadece komşu düğüm alınır. Düğüm geri almak 500 Kina.</div></div></div>
  <div class="sec">Bonus seviyelerine göre eksik yetenek düğümleri</div><div class="card"><table><tr><th></th><th>Yetenek</th><th>Bonus</th><th>Durum</th></tr>${rows}</table></div>`;
}

const R = { akt:rAkt, pas:rPas, stg:rStg, mak:rMak, pln:rPln, dae:rDae };
function render(){
  document.getElementById("modes").innerHTML = Object.entries(MODES).map(([k,m])=>`<button data-m="${k}" class="${S.mode===k?"on":""}">${m.ad}</button>`).join("");
  document.getElementById("tabs").innerHTML = TABS.map(([k,t])=>`<button data-t="${k}" class="${TAB===k?"on":""}">${t}</button>`).join("");
  document.getElementById("main").innerHTML = R[TAB]();
  const rf = document.getElementById("rfid"); if(rf){ const upd=()=>{ document.getElementById("rfout").textContent = `+${refund(rf.value, +document.getElementById("rfto").value||1)} puan geri gelir`; }; rf.onchange=upd; document.getElementById("rfto").oninput=upd; upd(); }
}
document.addEventListener("click", e=>{
  const m = e.target.closest("[data-m]"), t = e.target.closest("[data-t]");
  if(m){ S.mode = m.dataset.m; save(); render(); }
  if(t){ TAB = t.dataset.t; render(); window.scrollTo(0,0); }
});
document.addEventListener("change", e=>{
  const el = e.target; const v = Math.max(0, parseInt(el.value)||0);
  if(el.dataset.id){ const i=+el.dataset.i; S.lv[el.dataset.id][i] = i===0 ? Math.min(10,Math.max(1,v)) : Math.min(15,v); }
  else if(el.dataset.st){ S.st[el.dataset.st] = Math.min(20,Math.max(1,v)); }
  else if(el.id==="fs") S.freeSkill=v; else if(el.id==="ft") S.freeStigma=v; else return;
  save(); const y = window.scrollY; render(); window.scrollTo(0,y);
});
document.getElementById("exp").onclick = ()=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"})); a.download="templar_tank_yedek.json"; a.click(); };
document.getElementById("imp").onclick = ()=>document.getElementById("impf").click();
document.getElementById("impf").onchange = async e=>{ try{ S = merge(JSON.parse(await e.target.files[0].text())); save(); render(); }catch(err){ alert("Yedek okunamadı."); } };
render();
</script>
</body>
